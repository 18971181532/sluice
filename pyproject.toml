[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice-tcp"
version = "1.0.0"
description = "A packet-level TCP laboratory in pure Python: three congestion controls, one wire, and a ledger that checks every byte."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "遥か" }]
keywords = ["tcp", "congestion-control", "network-simulation", "reno", "cubic", "vegas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: System :: Networking",
]

[project.scripts]
sluice = "sluice.cli:main"

[project.urls]
Homepage = "https://github.com/18971181532/sluice"
Source = "https://github.com/18971181532/sluice"

[tool.setuptools]
packages = ["sluice"]
